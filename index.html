<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>opengame — multiplayer 3D arena</title>
  <!-- @live-reload -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%2366ff66'/></svg>">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e14; overflow: hidden; font-family: monospace; }
    #game { position: fixed; inset: 0; }
    #hud { position: fixed; top: 12px; left: 12px; color: #fff; z-index: 10; text-shadow: 0 1px 2px #000; }
    #hp-bar { width: 220px; height: 14px; border: 1px solid #444; border-radius: 7px; background: #000a; overflow: hidden; }
    #hp-fill { height: 100%; width: 100%; background: #4caf50; transition: width .15s; }
    #cooldown-bar { width: 220px; height: 6px; margin-top: 3px; border-radius: 3px; background: #000a; overflow: hidden; }
    #cooldown-fill { height: 100%; width: 0%; background: #ffd54f; }
    #skill-cooldown-bar { width: 220px; height: 6px; margin-top: 3px; border-radius: 3px; background: #000a; overflow: hidden; }
    #skill-cooldown-fill { height: 100%; width: 0%; background: #4fc3f7; }
    #hud-text { margin-top: 6px; font-size: 13px; }
    #leaderboard { position: fixed; top: 12px; right: 12px; z-index: 10; color: #ddd; font-size: 13px;
      text-align: right; text-shadow: 0 1px 2px #000; }
    #net-badge { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: none; color: #ffd54f; font-size: 12px; background: #000a; border: 1px solid #ffd54f66;
      border-radius: 6px; padding: 3px 10px; text-shadow: 0 1px 2px #000; }
    #leaderboard span { display: block; }
    #leaderboard b { color: #ffd54f; }
    #countdown { position: fixed; inset: 0; display: grid; place-items: center; z-index: 15;
      color: #fff; font-size: 120px; font-weight: bold; text-shadow: 0 4px 12px #000; pointer-events: none; }
    #flash { position: fixed; inset: 0; z-index: 12; background: #f00; opacity: 0; pointer-events: none; }
    #gameover { position: fixed; inset: 0; display: none; place-items: center; z-index: 20; background: #0008; cursor: pointer; }
    #gameover.visible { display: grid; }
    #gameover .card { text-align: center; color: #fff; font-size: 30px; text-shadow: 0 2px 4px #000; }
    #gameover .sub { font-size: 15px; color: #ffd54f; margin-top: 12px; }
    #login { position: fixed; inset: 0; display: none; place-items: center; z-index: 30; background: #0b0e14; }
    #login.visible { display: grid; }
    #login .card { text-align: center; color: #fff; }
    #login h1 { font-size: 26px; margin: 0 0 6px; }
    #login p { color: #888; font-size: 13px; margin: 0 0 16px; }
    #login input { font: 15px monospace; padding: 8px 12px; width: 220px; border-radius: 6px; border: 1px solid #333; background: #161b22; color: #fff; }
    /* long trycloudflare/tunnel hosts need more room than the name field */
    #login-server { width: 260px; margin-top: 8px; font-size: 13px; }
    #char-picker { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
    #mode-picker { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
    /* #login .char-card must outrank the generic "#login button" rule below. */
    #login .char-card { font: 13px monospace; padding: 8px 10px; border-radius: 6px; border: 1px solid #333;
      background: #161b22; color: #bbb; cursor: pointer; }
    #login .char-card:hover { border-color: #555; color: #fff; }
    #login .char-card.selected { border-color: #4caf50; color: #fff; background: #1d2a1e; }
    #login button { margin-top: 12px; font: 14px monospace; padding: 8px 26px; border-radius: 6px; border: none;
      background: #4caf50; color: #fff; cursor: pointer; }
    #login-error { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }

    /* --- Touch controls overlay (Mobile joystick + buttons) ------------ */
    #touch-controls { display: none; position: fixed; inset: 0; z-index: 14;
      pointer-events: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; user-select: none; }
    #touch-controls.tc-active { display: block; }

    #tc-stick-zone { position: absolute; left: 0; bottom: 0;
      width: 45vw; height: 70vh; pointer-events: auto; touch-action: none; }

    .tc-ring { position: fixed; border-radius: 50%; pointer-events: none;
      transform: translate(-50%, -50%); opacity: 0; transition: opacity .15s; }
    .tc-ring.tc-visible { opacity: 1; }
    #tc-base { width: 80px; height: 80px; background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.3); }
    #tc-knob { width: 44px; height: 44px; background: rgba(255,255,255,0.4);
      border: 2px solid rgba(255,255,255,0.6); }

    #tc-buttons { position: fixed; right: 16px; bottom: 24px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      pointer-events: auto; padding-bottom: env(safe-area-inset-bottom, 0);
      padding-right: env(safe-area-inset-right, 0); }

    .tc-btn { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.15); color: #fff; font-size: 26px;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .tc-btn:active { background: rgba(255,255,255,0.35); }
    .tc-btn-primary { width: 76px; height: 76px; font-size: 30px;
      background: rgba(255,80,80,0.3); border-color: rgba(255,100,100,0.5); }
    .tc-btn-primary:active { background: rgba(255,80,80,0.55); }
    .tc-btn-small { width: 44px; height: 44px; font-size: 18px;
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      padding-bottom: env(safe-area-inset-bottom, 0); }
    #reconnect { position: fixed; inset: 0; display: none; place-items: center; z-index: 25; background: #000a; }
    #reconnect.visible { display: grid; }
    #reconnect .card { color: #fff; font-size: 20px; text-align: center; }
    #reconnect .sub { color: #bbb; font-size: 13px; margin-top: 8px; }
    #upgrade-overlay { position: fixed; inset: 0; display: none; place-items: center; z-index: 22; background: #0007; }
    #upgrade-overlay.visible { display: grid; }
    #upgrade-overlay .upgrade-grid { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    #upgrade-overlay .up-card { width: 180px; min-height: 120px; background: #1b2332; border: 1px solid #4caf50; border-radius: 10px;
      padding: 12px; color: #fff; text-align: center; cursor: pointer; transition: transform .12s, border-color .12s; }
    #upgrade-overlay .up-card:hover { transform: translateY(-4px); border-color: #ffd54f; }
    #upgrade-overlay .up-title { font-size: 14px; font-weight: bold; color: #ffd54f; margin-bottom: 6px; }
    #upgrade-overlay .up-desc { font-size: 12px; color: #ccc; }
    #upgrade-overlay .up-timer { margin-top: 10px; font-size: 12px; color: #aaa; }
    #shop-overlay { position: fixed; inset: 0; display: none; place-items: center; z-index: 21; background: #0007; }
    #shop-overlay.visible { display: grid; }
    #shop-overlay .shop-grid { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    #shop-overlay .shop-card { width: 180px; min-height: 110px; background: #1b2332; border: 1px solid #4fc3f7; border-radius: 10px;
      padding: 12px; color: #fff; text-align: center; cursor: pointer; transition: transform .12s, border-color .12s; }
    #shop-overlay .shop-card:hover { transform: translateY(-4px); border-color: #ffd54f; }
    #shop-overlay .shop-title { font-size: 14px; font-weight: bold; color: #4fc3f7; margin-bottom: 6px; }
    #shop-overlay .shop-desc { font-size: 12px; color: #ccc; }
    #shop-overlay .shop-timer { margin-top: 10px; font-size: 12px; color: #aaa; }
    #paused-badge { position: fixed; top: 64px; left: 12px; z-index: 13; display: none; color: #ffd54f; background: #000a; border: 1px solid #ffd54f66; border-radius: 6px; padding: 4px 10px; font-size: 12px; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #ccc; font-size: 15px; z-index: 5; }
    #nametag-layer { position: fixed; inset: 0; z-index: 8; pointer-events: none; }
    .nametag { position: absolute; top: 0; left: 0; transform: translate(-50%, -100%);
      color: #fff; font-size: 12px; background: rgba(0,0,0,0.55); border: 1px solid #fff;
      border-radius: 4px; padding: 1px 6px; white-space: nowrap; text-shadow: none; }
    #float-layer { position: fixed; inset: 0; z-index: 9; pointer-events: none; overflow: hidden; }
    .float-text { position: absolute; top: 0; left: 0; font-size: 16px; font-weight: bold;
      color: #fff; text-shadow: 0 1px 2px #000; will-change: transform, opacity; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="nametag-layer"></div>
  <div id="float-layer"></div>

  <div id="hud">
    <div id="hp-bar"><div id="hp-fill"></div></div>
    <div id="cooldown-bar"><div id="cooldown-fill"></div></div>
    <div id="skill-cooldown-bar"><div id="skill-cooldown-fill"></div></div>
    <div id="hud-text">connecting…</div>
  </div>
  <div id="leaderboard"></div>
  <div id="net-badge">OFFLINE — SOLO MODE (no game server)</div>
  <div id="countdown"></div>
  <div id="flash"></div>

  <div id="gameover">
    <div class="card"><div id="gameover-title">GAME OVER</div><div class="sub" id="gameover-sub">click to respawn</div></div>
  </div>
  <div id="reconnect">
    <div class="card">connection lost<div class="sub">retrying…</div></div>
  </div>
  <div id="upgrade-overlay">
    <div style="text-align:center;">
      <div id="upgrade-title" style="color:#fff;font-size:20px;margin-bottom:12px;">LEVEL UP! Choose an upgrade</div>
      <div id="upgrade-grid" class="upgrade-grid"></div>
      <div id="upgrade-timer" class="up-timer"></div>
    </div>
  </div>
  <div id="shop-overlay">
    <div style="text-align:center;">
      <div id="shop-title" style="color:#fff;font-size:20px;margin-bottom:12px;">INTERMISSION SHOP — pick one</div>
      <div id="shop-grid" class="shop-grid"></div>
      <div id="shop-timer" class="shop-timer"></div>
    </div>
  </div>
  <div id="paused-badge">PAUSED — choosing upgrade</div>
  <div id="login">
    <div class="card">
      <h1>opengame</h1>
      <p>multiplayer arena survival — open this page in two tabs to play together</p>
      <input id="login-name" type="text" maxlength="16" placeholder="your name" autocomplete="off" />
      <input id="login-server" type="text" placeholder="game server (e.g. word-word-word.trycloudflare.com)" autocomplete="off" spellcheck="false" />
      <div id="char-picker"></div>
      <div id="mode-picker"></div>
      <br/>
      <button id="login-btn">JOIN</button>
      <div id="login-error"></div>
    </div>
  </div>
  <div id="loading">loading…</div>

  <!-- Boot watchdog: if the game code (CDN + modules) cannot load at all,
       show a clear error instead of a stuck "loading…" forever. -->
  <script>
    setTimeout(function () {
      if (window.__OPENGAME_BOOTED) return;
      var loading = document.getElementById('loading');
      var login = document.getElementById('login');
      var err = document.getElementById('login-error');
      if (loading) loading.style.display = 'none';
      if (err) {
        err.textContent = 'Failed to load the game code (CDN unreachable?). Check your connection and refresh.';
        err.style.display = 'block';
      }
      if (login) login.classList.add('visible');
    }, 20000);
  </script>
  <!-- Server-injected runtime config (ws URL, renderer flags) — see src/server/http.js -->
  <script src="./env.js"></script>

  <!-- three.js via ES module importmap, pinned (no bundler, no build step) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
      "@colyseus/schema": "https://cdn.jsdelivr.net/npm/@colyseus/schema@4.0.13/build/index.mjs"
    }
  }
  </script>
  <!-- colyseus.js client (0.17 SDK, pairs with colyseus@0.17 server), UMD script tag -> global `Colyseus` -->
  <script src="https://cdn.jsdelivr.net/npm/@colyseus/sdk@0.17.43/dist/colyseus.js"></script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
